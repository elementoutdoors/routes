name: Build and publish

# Rebuilds the site from Ride with GPS every hour from 6am to 8pm Brisbane (so a fix made in Ride with GPS reaches riders
# within the hour), at 3am, on every change, and on demand.
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 17 * * *'           # 3:07am Brisbane
    - cron: '7 20-23,0-10 * * *'   # every hour, 6:07am to 8:07pm Brisbane
  workflow_dispatch:

permissions:
  contents: write   # to keep natural voice recordings on the voice-cache branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Get saved voice recordings
        run: |
          if git fetch --depth=1 origin voice-cache:voice-cache 2>/dev/null; then git worktree add .voice-cache voice-cache; else mkdir -p .voice-cache; fi
          find .voice-cache -type f -not -path '*/.git*' | sort | xargs -r sha1sum | sha1sum > /tmp/voice-before
      - name: Build from Ride with GPS
        id: build
        continue-on-error: true
        env:
          ROUTE_SECRETS: ${{ secrets.ROUTE_SECRETS }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          VOICE_CACHE: .voice-cache
        run: node scripts/build.mjs
      - name: Keep new voice recordings
        if: always()
        run: |
          find .voice-cache -type f -not -path '*/.git*' | sort | xargs -r sha1sum | sha1sum > /tmp/voice-after
          if cmp -s /tmp/voice-before /tmp/voice-after; then echo "No new recordings"; exit 0; fi
          # one commit only, replaced each time, so the branch never piles up old audio
          mkdir -p /tmp/vc && cp -a .voice-cache/. /tmp/vc/ && rm -rf /tmp/vc/.git && cd /tmp/vc
          git init -q -b voice-cache
          git config user.name "Ride Guide build"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Voice recordings $(date -u +%FT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:voice-cache
          echo "Saved $(find . -name '*.mp3' | wc -l) recordings"

      # Staff screenshots for the EO Crew Ride Guide manual: taken on a phone-sized browser at 3am, on every change and on
      # demand, locked with EO Crew's public key (scripts/staff_bundle.mjs) and kept on the staff-screens branch, so the
      # hourly builds publish the last set without retaking them. A failure keeps the last set and never stops the build.
      - name: Get staff screenshots
        run: |
          if git fetch --depth=1 origin staff-screens:staff-screens 2>/dev/null; then git worktree add .staff-screens staff-screens; else mkdir -p .staff-screens; fi
          if [ -f .staff-screens/staff-screens.enc.json ]; then cp .staff-screens/staff-screens.enc.json dist/; fi
      - name: Take staff screenshots
        if: github.event_name != 'schedule' || github.event.schedule == '7 17 * * *' || hashFiles('.staff-screens/staff-screens.enc.json') == ''
        continue-on-error: true
        run: |
          pip install -q playwright==1.47.0 && python3 -m playwright install --with-deps chromium > /dev/null
          (python3 -m http.server 8765 -d dist > /dev/null 2>&1 &) && sleep 2
          python3 scripts/staff_screens.py http://localhost:8765/ /tmp/screens
          node scripts/staff_bundle.mjs screens /tmp/screens dist/staff-screens.enc.json
          mkdir -p /tmp/ss && cp dist/staff-screens.enc.json /tmp/ss/ && cd /tmp/ss
          git init -q -b staff-screens
          git config user.name "Ride Guide build"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Staff screenshots $(date -u +%FT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:staff-screens

      - name: Check the build has every route
        run: |
          test -f dist/index.html
          node -e "const h=require('./dist/health.json'); const bad=h.routes.filter(r=>!r.ok); if(!h.routes.length||bad.length===h.routes.length){console.error('No routes built');process.exit(1)}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Report problems
        run: |
          sleep 20
          curl -sf "${{ steps.deployment.outputs.page_url }}health.json" -o health.json
          node -e "const h=require('./health.json'); if(h.problems.length){console.error('Problems: '+h.problems.join('; '));process.exit(1)} console.log('All routes OK')"
