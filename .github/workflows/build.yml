name: Build and publish

# Rebuilds the site from Ride with GPS every hour from 6am to 8pm Brisbane (so a fix made in Ride with GPS reaches riders
# within the hour), at 3am, on every change, and on demand.
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 17 * * *'           # 3:07am Brisbane
    - cron: '7 20-23,0-10 * * *'   # every hour, 6:07am to 8:07pm Brisbane
  workflow_dispatch:

permissions:
  contents: write   # to keep natural voice recordings on the voice-cache branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned to Ubuntu 24.04 (13/11/2026). GitHub moved "ubuntu-latest" to Ubuntu 26.04, whose Python 3.14 cannot install
    # the pinned Playwright (1.47.0) that the staff screenshots and the ride sheets use, so both steps failed (without
    # stopping the build, so nobody was told). Move this and the two pip lines below together, and check both steps run.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Public toilets for the map icons (scripts/toilets.mjs), read from the base map tiles so they match the map's own icons.
      # Checked at 3am and on demand; downloads only when OpenFreeMap publishes a new map. A failed download keeps the last file.
      - name: Refresh public toilets
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 17 * * *'
        continue-on-error: true
        run: |
          node scripts/toilets.mjs
          if git diff --quiet -- config/toilets.json; then exit 0; fi
          git config user.name "Ride Guide build"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/toilets.json && git commit -q -m "Public toilets refreshed from the base map"
          git pull -q --rebase origin main && git push -q origin HEAD:main
      - name: Get saved voice recordings
        run: |
          if git fetch --depth=1 origin voice-cache:voice-cache 2>/dev/null; then git worktree add .voice-cache voice-cache; else mkdir -p .voice-cache; fi
          find .voice-cache -type f -not -path '*/.git*' | sort | xargs -r sha1sum | sha1sum > /tmp/voice-before
      - name: Build from Ride with GPS
        id: build
        continue-on-error: true
        env:
          ROUTE_SECRETS: ${{ secrets.ROUTE_SECRETS }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          VOICE_CACHE: .voice-cache
        run: node scripts/build.mjs
      - name: Keep new voice recordings
        if: always()
        run: |
          find .voice-cache -type f -not -path '*/.git*' | sort | xargs -r sha1sum | sha1sum > /tmp/voice-after
          if cmp -s /tmp/voice-before /tmp/voice-after; then echo "No new recordings"; exit 0; fi
          # one commit only, replaced each time, so the branch never piles up old audio
          mkdir -p /tmp/vc && cp -a .voice-cache/. /tmp/vc/ && rm -rf /tmp/vc/.git && cd /tmp/vc
          git init -q -b voice-cache
          git config user.name "Ride Guide build"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Voice recordings $(date -u +%FT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:voice-cache
          echo "Saved $(find . -name '*.mp3' | wc -l) recordings"

      # Staff screenshots for the EO Crew Ride Guide manual: taken on a phone-sized browser on every change, on demand, and
      # by the first scheduled build after the last set is 20 hours old (so once a night, whichever scheduled run GitHub
      # actually fires: since the afternoon of 5/11/2026 it has fired only 3 to 5 of the 16 scheduled builds a day, hours
      # late, so the 3am run cannot be counted on by name). Locked with EO Crew's public key
      # (scripts/staff_bundle.mjs) and kept on the staff-screens branch, so the other builds publish the last set without
      # retaking them. A failure keeps the last set and never stops the build. staff-screens.json (when they were last
      # taken and how many: nothing private) is published beside the locked file, so the weekly check (scripts/check.mjs)
      # can tell when the screenshots have stopped being retaken.
      - name: Get staff screenshots
        id: shots
        run: |
          if git fetch --depth=1 origin staff-screens:staff-screens 2>/dev/null; then git worktree add .staff-screens staff-screens; else mkdir -p .staff-screens; fi
          if [ -f .staff-screens/staff-screens.enc.json ]; then cp .staff-screens/staff-screens.enc.json dist/; fi
          stale=true
          if [ -f .staff-screens/staff-screens.json ]; then
            cp .staff-screens/staff-screens.json dist/ || true
            stale=$(node -e "try{const t=Date.parse(require('./.staff-screens/staff-screens.json').taken);console.log(Date.now()-t<20*3600*1000?'false':'true')}catch(e){console.log('true')}" 2>/dev/null || echo true)
          fi
          echo "stale=$stale" >> "$GITHUB_OUTPUT"
      - name: Take staff screenshots
        if: github.event_name != 'schedule' || steps.shots.outputs.stale == 'true' || hashFiles('.staff-screens/staff-screens.enc.json') == ''
        continue-on-error: true
        run: |
          pip install -q playwright==1.47.0 && python3 -m playwright install --with-deps chromium > /dev/null
          (python3 -m http.server 8765 -d dist > /dev/null 2>&1 &) && sleep 2
          python3 scripts/staff_screens.py http://localhost:8765/ /tmp/screens
          node scripts/staff_bundle.mjs screens /tmp/screens dist/staff-screens.enc.json
          node -e "const m=require('/tmp/screens/screens.json');require('fs').writeFileSync('dist/staff-screens.json',JSON.stringify({taken:m.taken,count:m.screens.length}))"
          mkdir -p /tmp/ss && cp dist/staff-screens.enc.json dist/staff-screens.json /tmp/ss/ && cd /tmp/ss
          git init -q -b staff-screens
          git config user.name "Ride Guide build"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Staff screenshots $(date -u +%FT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:staff-screens

      # Ride sheets and rides booklet (ride-sheets/build.py): one A4 sheet per live ride with its 3D map, photo, riding time
      # and Ride Guide QR code, and the combined booklet, kept up to date by themselves. Published only locked with EO
      # Crew's public key (booklet.pdf.enc with booklet.key.json, ride-sheets/<slug>.enc.json); the plain sheets never leave the runner. The 3D
      # maps, photos, manifest and last locked files are kept in the Actions cache (not public). Every step here is allowed
      # to fail: the last good booklet is kept and the site build carries on.
      - name: Restore ride sheet maps and photos
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: qr/booklet
          key: ride-sheets-v1-${{ github.run_id }}
          restore-keys: ride-sheets-v1-
      - name: Make the ride sheets and booklet
        id: booklet
        continue-on-error: true
        timeout-minutes: 45
        env:
          BOOKLET_MAP_BUDGET: 1200
          ROUTE_SECRETS: ${{ secrets.ROUTE_SECRETS }}   # only to lock the last good sheets kept in the cache
        run: |
          PLAN=$(python3 ride-sheets/build.py --plan | tail -1)
          echo "Ride sheets: $PLAN"
          if [ "$PLAN" != "none" ]; then
            pip install -q playwright==1.47.0 qrcode==7.4.2 pillow numpy scipy requests pypdf opencv-python-headless cryptography
            python3 -m playwright install --with-deps chromium > /dev/null
          fi
          python3 ride-sheets/build.py
      - name: Save ride sheet maps and photos
        if: always() && steps.booklet.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: qr/booklet
          key: ride-sheets-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check the build has every route
        run: |
          test -f dist/index.html
          node -e "const h=require('./dist/health.json'); const bad=h.routes.filter(r=>!r.ok); if(!h.routes.length||bad.length===h.routes.length){console.error('No routes built');process.exit(1)}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Report problems
        run: |
          sleep 20
          curl -sf "${{ steps.deployment.outputs.page_url }}health.json" -o health.json
          node -e "const h=require('./health.json'); if(h.problems.length){console.error('Problems: '+h.problems.join('; '));process.exit(1)} console.log('All routes OK')"
